<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="description" content="School management portal for students, teachers, and school administrators." />
    <script>
      // Apply saved preferences before React mounts to avoid a theme flash.
      document.documentElement.dataset.theme = localStorage.getItem('sms-theme') || 'light';
      document.documentElement.lang = localStorage.getItem('sms-language') || 'km';
    </script>
    <title>SMS · School Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
